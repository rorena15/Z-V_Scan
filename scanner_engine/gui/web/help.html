<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Z-VulnScan 도움말</title>
<style>
  :root {
    --surface-1: #F5F7FA; --surface-2: #FFFFFF; --border: #E3E7EE;
    --text: #1B2430; --text-secondary: #5B6675; --text-muted: #8B94A3;
    --accent: #2E6BE6; --accent-bg: #E8EFFE;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--surface-1); color: var(--text);
    font-family: 'Pretendard', '맑은 고딕', 'Malgun Gothic', 'Segoe UI', sans-serif;
    height: 100%;
  }
  .layout { display: flex; max-width: 1100px; margin: 20px auto; padding: 0 16px 40px; gap: 16px; align-items: flex-start; }
  .nav-card {
    width: 220px; flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px; box-shadow: 0 3px 22px rgba(0,0,0,0.05);
  }
  .nav-card button {
    display: block; width: 100%; text-align: left; padding: 9px 12px; border: none; background: transparent;
    border-radius: 8px; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; margin-bottom: 2px;
  }
  .nav-card button:hover { background: var(--surface-1); }
  .nav-card button.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .detail-card {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px 28px; box-shadow: 0 3px 22px rgba(0,0,0,0.05);
  }
  .detail-card h1 { margin: 0 0 14px; font-size: 17px; font-weight: 700; }
  .detail-body { font-size: 12.5px; line-height: 1.6; color: var(--text); }
  .detail-body p, .detail-body ul, .detail-body pre, .detail-body div { max-width: 100%; }
</style>
</head>
<body>
  <div class="layout">
    <div class="nav-card" id="categoryNav"></div>
    <div class="detail-card">
      <h1 id="detailTitle"></h1>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </div>

  <script src="/topbar.js"></script>
  <script src="/help.js"></script>
</body>
</html>
