[웹 대시보드 - 회차 비교] 자산별로 "최신 회차 vs 직전 회차" 보안 점수 변화를 보여주고,
행을 누르면 어떤 항목이 좋아졌고/나빠졌는지 코드 단위로 펼친다.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Z-VulnScan 회차 비교</title>
<style>
  :root {
    --surface-1: #F5F7FA; --surface-2: #FFFFFF; --border: #E3E7EE;
    --text: #1B2430; --text-secondary: #5B6675; --text-muted: #8B94A3;
    --accent: #2E6BE6; --accent-bg: #E8EFFE;
    --danger-bg: #FDE7E7; --danger-text: #C0271F;
    --warning-bg: #FFF6D6; --warning-text: #8A6A00;
    --success-bg: #E2F5E7; --success-text: #1B8A46;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--surface-1); color: var(--text);
    font-family: 'Pretendard', '맑은 고딕', 'Malgun Gothic', 'Segoe UI', sans-serif; }
  .wrap { max-width: 1000px; margin: 20px auto; padding: 0 16px 40px; }
  .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 3px 22px rgba(0,0,0,0.05); }
  .card h2 { margin: 0 0 4px; font-size: 13.5px; font-weight: 700; }
  .hint { font-size: 11.5px; color: var(--text-muted); margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-weight: 600; color: var(--text-muted); font-size: 10.5px; padding: 7px 6px; border-bottom: 1px solid var(--border); }
  td { padding: 7px 6px; border-bottom: 1px solid var(--border); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--accent-bg); }
  .delta { font-weight: 700; }
  .delta.up { color: var(--success-text); }
  .delta.down { color: var(--danger-text); }
  .delta.flat { color: var(--text-muted); }
  .badge { display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 8px; font-weight: 600; }
  .badge.improved { background: var(--success-bg); color: var(--success-text); }
  .badge.worsened { background: var(--danger-bg); color: var(--danger-text); }
  .badge.changed { background: var(--warning-bg); color: var(--warning-text); }
  .empty { color: var(--text-muted); font-size: 12px; padding: 10px 0; display: none; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); position: relative; min-width: 80px; }
  .bar > div { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
  #detailCard { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>자산별 점수 변화 (최신 회차 vs 직전 회차)</h2>
      <p class="hint">2회 이상 점검된 자산만 표시됩니다. 행을 누르면 항목별 변화가 아래에 펼쳐집니다. 점수는 취약/부분만족 건수에 따라 감점되는 100점 만점입니다(예외처리 항목 제외).</p>
      <table>
        <thead><tr><th>자산</th><th>직전</th><th>최신</th><th style="width:150px;">최신 점수</th><th>변화</th><th>취약 (전→후)</th><th>부분만족 (전→후)</th></tr></thead>
        <tbody id="compareBody"></tbody>
      </table>
      <div class="empty" id="compareEmpty">비교할 자산이 없습니다. 같은 자산을 두 번 이상 Audit하면 표시됩니다.</div>
    </div>

    <div class="card" id="detailCard">
      <h2 id="detailTitle">항목별 변화</h2>
      <table>
        <thead><tr><th>코드</th><th>항목명</th><th>직전 상태</th><th>최신 상태</th><th>변화</th></tr></thead>
        <tbody id="detailBody"></tbody>
      </table>
      <div class="empty" id="detailEmpty">상태가 바뀐 항목이 없습니다.</div>
    </div>
  </div>

  <script src="/topbar.js"></script>
  <script src="/compare.js"></script>
</body>
</html>
