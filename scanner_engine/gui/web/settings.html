[웹 대시보드 - 설정] gui/settings_dialog.py의 7개 탭 중 웹에서도 안전하게 다룰 수
있는 부분만 옮겼다: 로그/이력 보관, 테마, 리포트 출력 경로, 호스트 키, 라이선스.
웹 대시보드 로그인 계정 관리는 별도 상단 탭(/accounts)으로 분리했다. "기본
계정/자격증명"(OS keyring 저장)과 "룰셋/전문가 프로필"은 Expert Mode와 함께
데스크톱 전용으로 남아있다.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Z-VulnScan 설정</title>
<style>
  :root {
    --surface-1: #F5F7FA; --surface-2: #FFFFFF; --border: #E3E7EE;
    --text: #1B2430; --text-secondary: #5B6675; --text-muted: #8B94A3;
    --accent: #2E6BE6; --accent-bg: #E8EFFE;
    --danger-bg: #FDE7E7; --danger-text: #C0271F;
    --success-bg: #E2F5E7; --success-text: #1B8A46;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--surface-1); color: var(--text);
    font-family: 'Pretendard', '맑은 고딕', 'Malgun Gothic', 'Segoe UI', sans-serif;
  }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  .topbar a { color: var(--text-secondary); text-decoration: none; font-size: 12.5px; }
  .topbar .title { font-weight: 700; font-size: 13.5px; }
  .topbar .spacer { flex: 1; }
  .wrap { max-width: 820px; margin: 20px auto; padding: 0 16px 40px; }
  .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 3px 22px rgba(0,0,0,0.05); }
  .card h2 { margin: 0 0 12px; font-size: 13.5px; font-weight: 700; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row > div { flex: 1; min-width: 160px; }
  label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=password], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12.5px;
    background: var(--surface-1); color: var(--text);
  }
  .btn { padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; font-size: 12.5px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-danger { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-text); }
  .btn-secondary { background: var(--surface-1); color: var(--text); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th { text-align: left; font-weight: 600; color: var(--text-muted); font-size: 10.5px; padding: 6px; border-bottom: 1px solid var(--border); }
  td { padding: 6px; border-bottom: 1px solid var(--border); }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 8px; font-weight: 600; background: var(--accent-bg); color: var(--accent); }
  .msg { font-size: 12px; margin-top: 8px; }
  .msg.ok { color: var(--success-text); }
  .msg.err { color: var(--danger-text); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>일반</h2>
      <div class="row">
        <div>
          <label>스캔 이력 보관 기간 (일)</label>
          <input type="number" id="logRetention" min="1">
        </div>
        <div>
          <label>테마</label>
          <select id="theme"><option value="light">라이트</option><option value="dark">다크</option></select>
        </div>
        <div>
          <label>리포트 출력 경로 (비우면 기본값)</label>
          <input type="text" id="reportDir" placeholder="예: E:\Reports">
        </div>
      </div>
      <button class="btn btn-primary" id="btnSaveGeneral">저장</button>
      <button class="btn btn-secondary" id="btnPurge">오래된 이력 정리</button>
      <div id="generalMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>라이선스</h2>
      <p id="licenseInfo" style="font-size:12.5px;"></p>
      <div class="row">
        <div>
          <label>라이선스 키</label>
          <input type="password" id="licenseKey" placeholder="ZV3-...">
        </div>
      </div>
      <button class="btn btn-primary" id="btnActivate">활성화</button>
      <button class="btn btn-danger" id="btnDeleteLicense">라이선스 삭제</button>
      <div id="licenseMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>호스트 키 (known_hosts)</h2>
      <p style="font-size:11.5px;color:var(--text-muted);margin-top:0;">SSH 접속 시 최초 등록된 호스트 키 목록입니다. 서버가 재설치돼 키가 바뀌었다면 여기서 삭제해야 다시 접속할 수 있습니다.</p>
      <table><thead><tr><th>호스트</th><th>키 타입</th><th></th></tr></thead><tbody id="knownHostsBody"></tbody></table>
      <button class="btn btn-danger" id="btnClearHosts" style="margin-top:10px;">전체 초기화</button>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
        <h2 style="margin:0;">감사 로그</h2>
        <button class="btn btn-secondary" id="btnRefreshAuditLog" style="padding:5px 12px; font-size:11.5px;">새로고침</button>
      </div>
      <p style="font-size:11.5px;color:var(--text-muted);margin:4px 0 10px;">로그인, 계정/설정/라이선스 변경, 자산·Waiver 편집, 스캔 실행, 리포트 생성, 서버 종료 등 웹 대시보드 자체의 운영 기록입니다(최근 100건).</p>
      <table>
        <thead><tr><th>시각</th><th>사용자</th><th>동작</th><th>상세</th></tr></thead>
        <tbody id="auditLogBody"></tbody>
      </table>
      <div id="auditLogEmpty" style="color:var(--text-muted); font-size:12px; padding:8px 0; display:none;">기록이 없습니다.</div>
    </div>

  </div>

  <script src="/topbar.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
