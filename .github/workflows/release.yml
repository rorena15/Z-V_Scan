name: Build & Release

# v로 시작하는 태그를 push하면 자동 실행됨 (예: git tag v3.1.0 && git push origin v3.1.0).
# workflow_dispatch로 수동 실행도 가능 - 이때는 입력한 버전 문자열을 쓰고,
# 비워두면 실패한다(태그 push가 아니므로 github.ref_name이 브랜치명이라 버전으로
# 못 씀).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "릴리즈 버전 (예: v3.1.0)"
        required: true

# GitHub Release 생성 + 에셋 업로드에 필요
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: 저장소 체크아웃 (태그 간 커밋 로그 확보 위해 전체 이력 포함)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 릴리즈 버전 확정
        id: ver
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ("${{ github.ref_type }}" -ne "tag") {
              throw "태그 push가 아닌데 버전도 입력 안 됨 - workflow_dispatch일 땐 version 입력 필수"
            }
            $version = "${{ github.ref_name }}"
          }
          if (-not $version.StartsWith("v")) { $version = "v$version" }
          Write-Host "Release version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Python 3.14 설치
        uses: actions/setup-python@v5
        with:
          # 이 저장소의 로컬 빌드 환경(python.version 파일 기준)과 동일한 라인.
          # 러너 이미지에 3.14.x가 아직 없다면 "3.13"으로 낮춰서 재시도할 것.
          python-version: "3.14"

      - name: MSVC 빌드 환경 설정 (cl.exe/link.exe를 PATH에 추가)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 런타임/빌드 의존성 설치
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pillow: PyInstaller --splash(스플래시 화면, 2026-09 부팅 체감속도 개선)가
          # 빌드 시점에 assets/splash.png를 처리하는 데 필요 - 앱 런타임 의존성은 아님.
          pip install cython pyarmor pyinstaller setuptools pillow

      - name: 테스트 (룰 무결성 / 판정 엔진 / 룰 로컬 픽스처 / 웹 대시보드)
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          # 소스 기준 회귀 검사 - 빌드(수 분)에 들어가기 전에 룰/판정/웹 서버 문제를 먼저 잡는다.
          # 룰 로컬 픽스처는 이 러너의 PowerShell(임시 레지스트리 키)과 Git Bash(임시 폴더)로 돈다.
          python -m unittest discover -s tests -v

      - name: 버전 삽입 - AppConfig.VERSION을 릴리즈 태그로 교체
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $configPath = "scanner_engine/core/config.py"
          (Get-Content $configPath -Raw) -replace 'VERSION = "[^"]*"', "VERSION = `"$version`"" |
            Set-Content $configPath -Encoding utf8 -NoNewline
          Write-Host "--- config.py VERSION line ---"
          Select-String -Path $configPath -Pattern "VERSION ="

      - name: 릴리즈 비밀값 주입 (라이선스 salt / 룰 암호화 키 / 엔진 토큰)
        shell: pwsh
        env:
          ZVULN_LICENSE_SALT: ${{ secrets.ZVULN_LICENSE_SALT }}
          ZVULN_RULE_KEY: ${{ secrets.ZVULN_RULE_KEY }}
          ZVULN_ENGINE_TOKEN: ${{ secrets.ZVULN_ENGINE_TOKEN }}
        run: |
          # 저장소의 config.py에는 개발 전용 더미만 있다. 시크릿이 없거나 더미/형식 오류면 여기서 실패해서
          # 더미 값으로 만든 릴리즈가 배포되는 일을 막는다. (ci/gen_release_secrets.py로 값을 만들어 등록)
          python ci/inject_release_secrets.py

      - name: Cython 컴파일 (core/utils/output -> .pyd)
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
          # 로컬 개발 환경(Visual Studio "18")에서 distutils가 버전 인식을 못 해
          # 필요했던 우회 설정. GitHub 표준 windows-latest 이미지는 정식
          # 지원되는 VS 버전이라 없어도 될 가능성이 높지만, 켜둬도 무해해서
          # 로컬/CI 동작을 최대한 맞추기 위해 그대로 유지한다.
          DISTUTILS_USE_SDK: "1"
          MSSdk: "1"
        run: |
          python ci/build_cython.py build_ext --inplace

      - name: PyArmor 난독화 (gui만 대상, 대용량 스크립트는 trial 한계로 제외 후 평문 병합)
        shell: pwsh
        run: |
          if (Test-Path "dist/obfuscated") { Remove-Item "dist/obfuscated" -Recurse -Force }

          # [2026-08-20] "out of license" 빌드 실패 원인 로컬 재현으로 확인함:
          # 1) 파일당(스크립트당) 크기/복잡도 상한이 있다(`pyarmor --version`이 스스로
          #    밝히는 trial 제약 "Can't obfuscate big script") - main_window.py(1939줄)는
          #    이미 이 이유로 제외돼 있었는데, dashboard_widgets.py(1172줄)도 같은
          #    상한을 넘어 매번 여기서 멈췄다.
          # 2) 한 번의 pyarmor gen 호출 안에서 처리하는 전체 누적 크기에도 상한이
          #    있다 - 위 두 파일만 제외해도 레포 전체(`-r .`)를 대상으로 하면 여전히
          #    다른 파일(db_connector.py 등, 파일 자체는 크지 않음)에서 멈춘다.
          # build_final_v3.ps1 [2/4]가 core/utils/output은 항상 Cython .pyd로
          # 덮어쓰므로(무조건, gui처럼 "비어있을 때만" 조건 없음) 그 세 폴더와
          # ci/*.py, 루트 스크립트(ico/library/make_ppt.py - 실제 배포판에 포함 안 됨)를
          # PyArmor로 난독화해봐야 결과물이 전부 버려진다 - 애초에 필요 없는 작업이었고,
          # 누적 상한을 불필요하게 갉아먹고 있었다. gui/(+ main.py, keygen.py)만 대상으로
          # 좁히면 이 상한 안에 들어와 매번 정상 완료된다(로컬 재현으로 확인).
          pyarmor gen -O dist/obfuscated --obf-code 0 --no-wrap -r `
              --exclude "*main_window.py" `
              --exclude "*dashboard_widgets.py" `
              scanner_engine/gui scanner_engine/main.py

          Copy-Item "scanner_engine/gui/main_window.py" `
              "dist/obfuscated/gui/main_window.py" -Force
          Copy-Item "scanner_engine/gui/dashboard_widgets.py" `
              "dist/obfuscated/gui/dashboard_widgets.py" -Force

          # pyarmor가 "scanner_engine/gui"를 --paths 없이 스캔하면 dist/obfuscated
          # 밑에 scanner_engine/를 안 붙이고 바로 gui/, main.py, keygen.py로 풀어낸다
          # (위 로컬 재현에서 확인된 실제 출력 구조) - build_final_v3.ps1이 기대하는
          # dist/obfuscated/scanner_engine/... 구조로 옮겨준다.
          New-Item -ItemType Directory -Force -Path "dist/obfuscated/scanner_engine" | Out-Null
          Move-Item "dist/obfuscated/gui" "dist/obfuscated/scanner_engine/gui" -Force
          Move-Item "dist/obfuscated/main.py" "dist/obfuscated/scanner_engine/main.py" -Force

      - name: 최종 패키징 (PyInstaller onedir + 스플래시 화면 + zip)
        id: package
        shell: pwsh
        run: |
          ci/build_final_v3.ps1 -Version "${{ steps.ver.outputs.version }}"
          $version = "${{ steps.ver.outputs.version }}"
          $distDir = "Z-VulnScan_Professional_${version}_Final"
          $appName = "Z-VulnScan_Professional_Edition_$version"
          "exe_path=$distDir\$appName\$appName.exe" >> $env:GITHUB_OUTPUT
          "zip_path=$distDir\$appName.zip" >> $env:GITHUB_OUTPUT

      - name: 빌드 검증 - exe 자가진단 (--selftest)
        shell: pwsh
        run: |
          # 방금 만든 exe가 실제로 동작 가능한 상태인지(모듈/hidden import/룰셋 복호화/웹 정적 파일/Flask)
          # GUI 없이 확인한다. 소스에서는 통과하던 코드가 패키징 과정에서 깨진 경우를 릴리즈 전에 막는다.
          $exe = "${{ steps.package.outputs.exe_path }}"
          $out = Join-Path (Get-Location) "selftest.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "--selftest-out", "`"$out`"" `
              -Wait -PassThru -NoNewWindow
          if (Test-Path $out) { Get-Content $out -Encoding utf8 } else { Write-Host "(selftest 결과 파일 없음)" }
          if ($p.ExitCode -ne 0) { throw "exe 자가진단 실패 (exit $($p.ExitCode))" }

      - name: 빌드 검증 - GPL 전용 Qt 모듈/keygen 미포함 확인
        shell: pwsh
        run: |
          # Qt Graphs / Qt Quick 3D / Qt Virtual Keyboard는 GPLv3(또는 상용)로만 제공되는 모듈이라 독점 배포물에 있으면 안 된다.
          # ci/zvulnscan.spec이 빼지만, PySide6 업그레이드로 새 파일이 딸려 들어오는 경우를 릴리즈 전에 막는다.
          # (keygen은 라이선스 발급 도구라 고객 배포물에 절대 들어가면 안 된다 - 같이 검사)
          $root = Split-Path "${{ steps.package.outputs.exe_path }}" -Parent
          $bad = Get-ChildItem $root -Recurse -File | Where-Object {
              $_.Name -match 'keygen' -or $_.Name -match '^Qt6(Graphs|Quick3D|VirtualKeyboard)' -or $_.FullName -match '[\/](QtGraphs|QtQuick3D|QtVirtualKeyboard|virtualkeyboard)[\/]'
          }
          if ($bad) { $bad | ForEach-Object { Write-Host $_.FullName }; throw "GPL 전용 Qt 모듈이 배포물에 포함됨 ($($bad.Count)개)" }
          Write-Host "GPL 전용 Qt 모듈 없음"

      - name: 릴리즈 노트(코멘터리) 생성 - 직전 태그 이후 커밋 로그
        id: notes
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"

          # [버그 수정] 예전엔 "$version^"(예: "v3.1.0^")을 git 리비전으로 직접
          # 넘겼는데, 이건 실제 태그 push로 트리거된 경우에만 유효한 git 객체다.
          # workflow_dispatch로 수동 실행하면 $version은 사용자가 입력창에 타이핑한
          # 문자열일 뿐 그 이름의 git 태그가 실제로 존재하지 않을 수 있어서
          # "fatal: ambiguous argument ... unknown revision" 에러가 난다.
          # git 조회는 항상 실제로 존재가 보장되는 HEAD 기준으로 하고, $version은
          # 노트에 표시되는 텍스트로만 쓴다.
          $prevTag = $null
          try {
            $prevTag = git describe --tags --abbrev=0 "HEAD^" 2>$null
            if ($LASTEXITCODE -ne 0) { $prevTag = $null }
          } catch { $prevTag = $null }

          if ($prevTag) {
            $range = "$prevTag..$version"
            $log = git log --no-merges --pretty=format:"- %s (%h)" "$prevTag..HEAD"
          } else {
            # 첫 릴리즈 - 비교할 이전 태그가 없다. 전체 커밋 이력(350개 이상)을
            # 그대로 넣으면 노트가 너무 길어지므로 최근 50개만 보여준다.
            $range = "$version (첫 릴리즈, 최근 50개 커밋만 표시)"
            $log = git log --no-merges --pretty=format:"- %s (%h)" -n 50 HEAD
          }

          if (-not $log) { $log = "- (변경 커밋 없음)" }

          # PowerShell here-string(@"..."@)은 닫는 줄이 반드시 컬럼 0에 와야 하는데,
          # YAML의 'run: |' 블록은 항상 들여쓰기가 들어가서 그 규칙과 충돌한다.
          # 그래서 줄 배열을 만들어 join하는 방식으로 우회한다.
          $lines = @(
              "## Z-VulnScan Professional $version"
              ""
              "### 변경 사항 ($range)"
              ""
          ) + ($log -split "`n") + @(
              ""
              "---"
              "하이브리드 빌드(Cython + PyArmor + PyInstaller)로 자동 생성됨."
          )

          $notesPath = "release_notes.md"
          $lines -join "`n" | Set-Content $notesPath -Encoding utf8

          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: GitHub Release 생성 + 배포 zip 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "Z-VulnScan Professional ${{ steps.ver.outputs.version }}"
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ steps.package.outputs.zip_path }}
